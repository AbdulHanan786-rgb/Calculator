<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator-Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class="flex flex-col items-center">


        <div class="bg-black  h-[520px] mt-24  w-80  rounded-md">
            <h1 class="text-center text-5xl  text-red-400 mt-2 ">Calculator</h1>
            <input id="display" class="bg-green-200 p-4 text-4xl h-16 w-72 ml-4 border-2 border-gray-400 rounded-md mt-6">

            <div class="grid grid-cols-4 gap-6 ml-3 mt-6">

                <button  onclick="clearDisplay()" class="bg-red-400 text-white text-4xl h-12 w-12 rounded-md">C</button>
                <button  onclick="deleteLast()" class="bg-red-400 text-white text-2xl h-12 w-12 rounded-md">DEL</button>
                <button  onclick="addNumber('**')" class="bg-red-400 text-white text-2xl h-12 w-12 rounded-md">EXP</button>
                <button onclick="showAnswer()" class="bg-red-400 text-white text-2xl h-12 w-12 rounded-md">Ans</button>

                <button onclick="addNumber('7')" class="bg-gray-400 text-white text-4xl h-12 w-12  rounded-md">7</button>
                <button onclick="addNumber('8')" class="bg-gray-400 text-white text-4xl h-12 w-12 rounded-md">8</button>
                <button onclick="addNumber('9')" class="bg-gray-400 text-white text-4xl h-12 w-12 rounded-md">9</button>
                <button onclick="addNumber('/')" class="bg-red-400 text-white text-4xl h-12 w-12 rounded-md">/</button>

                <button onclick="addNumber('4')" class="bg-gray-400 text-white text-4xl h-12 w-12 rounded-md">4</button>
                <button onclick="addNumber('5')" class="bg-gray-400 text-white text-4xl h-12 w-12 rounded-md">5</button>
                <button onclick="addNumber('6')" class="bg-gray-400 text-white text-4xl h-12 w-12 rounded-md">6</button>
                <button onclick="addNumber('*')" class="bg-red-400 text-white text-4xl h-12 w-12 rounded-md">*</button>

                <button onclick="addNumber('1')" class="bg-gray-400 text-white text-4xl h-12 w-12 rounded-md">1</button>
                <button onclick="addNumber('2')" class="bg-gray-400 text-white text-4xl h-12 w-12 rounded-md">2</button>
                <button onclick="addNumber('3')" class="bg-gray-400 text-white text-4xl h-12 w-12 rounded-md">3</button>
                <button onclick="addNumber('-')" class="bg-red-400 text-white text-4xl h-12 w-12 rounded-md">-</button>

                <button onclick="addNumber('0')" class="bg-gray-400 text-white text-4xl h-12 w-12 rounded-md">0</button>
                <button onclick="addNumber('.')" class="bg-gray-400 text-white  text-center h-12 font-bold w-12 rounded-md">.</button>
                <button  onclick="calculate()"   class="bg-green-400 text-white text-4xl h-12 w-12 rounded-md">=</button>
                <button onclick="addNumber('+')" class="bg-red-400 text-white text-4xl h-12 w-12 rounded-md">+</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
